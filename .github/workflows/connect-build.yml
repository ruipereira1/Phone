# Fossify Connect: compilação e testes do fork.
# Os outros workflows desta pasta vêm do upstream e chamam workflows privados da Fossify. No
# GitHub do fork, desligam-se uma vez (ver FORK.md, secção "CI").
name: Connect · build

on:
  push:
    branches: [connect/main, "sync/**"]
  pull_request:
    branches: [connect/main]
  workflow_dispatch:

permissions:
  contents: write # para publicar o APK de testes na versão "connect-teste"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários (app + módulos Connect)
        run: ./gradlew --no-daemon :app:testFossDebugUnitTest :connect-facetime:testDebugUnitTest

      - name: APK de testes (foss, debug)
        run: ./gradlew --no-daemon :app:assembleFossDebug

      - name: Independência dos módulos (cada um compila sozinho)
        run: ./gradlew --no-daemon :connect-core:assembleDebug :connect-facetime:assembleDebug :connect-simple-ui:assembleDebug :connect-matrix:assembleDebug

      - name: Verificar applicationId
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump packagename "$APK" | tee /dev/stderr | grep -qx "pt.familia.connect.debug"

      - uses: actions/upload-artifact@v4
        with:
          name: fossify-connect-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK de testes (link direto)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/connect/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/foss/debug/*.apk | head -1)
          cp "$APK" fossify-connect-teste.apk
          NOTES="APK de testes (debug) do Fossify Connect, gerado a partir de ${GITHUB_SHA::8}. Instala-se ao lado da Fossify Phone (applicationId pt.familia.connect.debug). Não é uma versão final."
          if gh release view connect-teste >/dev/null 2>&1; then
            gh release upload connect-teste fossify-connect-teste.apk --clobber
            gh release edit connect-teste --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create connect-teste fossify-connect-teste.apk --prerelease --target "$GITHUB_SHA" \
              --title "Fossify Connect — APK de testes" --notes "$NOTES"
          fi
